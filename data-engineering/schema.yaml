# Feature contract between the data, modeling and dashboard sides of the project.
# Owner: Axelle. The application and its dummy data are generated from this file,
# so a field added here appears in the UI without any UI change.
# Values below describe the active dataset (Pima Indians Diabetes Dataset).

version: 1
dataset: pima_indians_unprocessed

features:
  Pregnancies:
    type: int
    min: 0
    max: 17
    unit: count
    definition: Number of times pregnant
  Glucose:
    type: float
    min: 44.0
    max: 200.0
    decimals: 1
    unit: mg/dL
    definition: 2-hour plasma glucose concentration post-OGTT
  BloodPressure:
    type: float
    min: 24.0
    max: 122.0
    decimals: 1
    unit: mm Hg
    definition: Diastolic blood pressure
  SkinThickness:
    type: float
    min: 7.0
    max: 99.0
    decimals: 1
    unit: mm
    definition: Triceps skin fold thickness
  Insulin:
    type: float
    min: 14.0
    max: 846.0
    decimals: 1
    unit: mu U/ml
    definition: 2-Hour serum insulin
  BMI:
    type: float
    min: 18.0
    max: 67.1
    decimals: 1
    unit: kg/m2
    definition: Body mass index (weight in kg/(height in m)^2)
  DiabetesPedigreeFunction:
    type: float
    min: 0.07
    max: 2.42
    decimals: 3
    unit: score
    definition: Diabetes pedigree function (genetic risk score)
  Age:
    type: int
    min: 21
    max: 81
    unit: years
    definition: Age in years

target:
  name: Outcome
  type: binary
  positive_rate: 0.349
  definition: 1 when the patient is diagnosed with diabetes, 0 otherwise
